name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs full history, and the guard needs origin/vN/main

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Runs first so a bad tag fails fast. The tag must match the computed package version, its
      # major must be the CMS major this branch targets, and the tagged commit must be on vN/main.
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          dotnet tool install -g nbgv --version 3.7.115 # keep in step with Directory.Build.props
          export PATH="$PATH:$HOME/.dotnet/tools"
          package_version="$(nbgv get-version -v NuGetPackageVersion)"
          cms_major="$(grep -oP '<PackageVersion Include="Umbraco\.Cms" Version="\[\K\d+' Directory.Packages.props)"
          tag_version="${RELEASE_TAG#v}"
          echo "Tag: $RELEASE_TAG | package version: $package_version | CMS major: $cms_major"
          if [ -z "$cms_major" ]; then
            echo "::error::Could not read the Umbraco.Cms major from Directory.Packages.props"; exit 1
          fi
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $package_version. Check version.json and the tag."; exit 1
          fi
          if [ "${tag_version%%.*}" != "$cms_major" ]; then
            echo "::error::Tag major ${tag_version%%.*} does not match the CMS major $cms_major targeted by this branch."; exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "origin/v${cms_major}/main"; then
            echo "::error::Tagged commit is not on origin/v${cms_major}/main. Merge vN/dev into vN/main and tag a commit on vN/main."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Frontend output (wwwroot/) is gitignored and not built by MSBuild
      - run: npm ci
      - run: npm run build
      - run: npm test

      - run: dotnet restore Umbraco.Community.AI.Carbon.slnx
      - run: dotnet build Umbraco.Community.AI.Carbon.slnx -c Release --no-restore
      - run: dotnet test Umbraco.Community.AI.Carbon.slnx -c Release --no-build

      - run: dotnet pack Umbraco.Community.AI.Carbon.slnx -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*nupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to request the OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # Exchanges this workflow's OIDC token for a short-lived (1 hour) NuGet API key.
      # Requires a Trusted Publishing policy on nuget.org for this repo + workflow file.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile name, not your email

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
